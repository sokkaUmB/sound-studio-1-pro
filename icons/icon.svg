<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Anello esterno bianco polarizzato isolante -->
  <circle cx="256" cy="256" r="244" fill="#ffffff"/>
  
  <!-- Base circolare obsidian dark -->
  <circle cx="256" cy="256" r="232" fill="#0c0c10"/>
  
  <!-- Cornice circolare tecnica di precisione -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#252534" stroke-width="4"/>
  
  <!-- Le 9 barre verticali con perfetta simmetria speculare, centrate matematicamente a (256, 256) -->
  <g>
    <!-- 1. Attacco sinistro -->
    <rect x="102" y="196" width="20" height="120" rx="10" fill="#ffffff"/>
    <!-- 2. Crescita sinistra -->
    <rect x="138" y="156" width="20" height="200" rx="10" fill="#d4d4dc"/>
    <!-- 3. Picco Nothing Red sinistro -->
    <rect x="174" y="126" width="20" height="260" rx="10" fill="#eb0029"/>
    <!-- 4. Rientro sinistro -->
    <rect x="210" y="176" width="20" height="160" rx="10" fill="#b0b0bc"/>
    
    <!-- 5. Centro esatto / Asse di simmetria (x=246, centro a 256) -->
    <rect x="246" y="206" width="20" height="100" rx="10" fill="#ffffff"/>
    
    <!-- 6. Rientro destro (specchio di 4) -->
    <rect x="282" y="176" width="20" height="160" rx="10" fill="#b0b0bc"/>
    <!-- 7. Picco Nothing Red destro (specchio di 3) -->
    <rect x="318" y="126" width="20" height="260" rx="10" fill="#eb0029"/>
    <!-- 8. Discesa destra (specchio di 2) -->
    <rect x="354" y="156" width="20" height="200" rx="10" fill="#d4d4dc"/>
    <!-- 9. Rilascio destro (specchio di 1) -->
    <rect x="390" y="196" width="20" height="120" rx="10" fill="#ffffff"/>
  </g>
</svg>
